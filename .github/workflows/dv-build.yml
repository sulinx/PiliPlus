name: Build DV APK

on:
    workflow_dispatch:
        inputs:
            dev_suffix:
                description: "使用 dev 后缀（包名 com.example.piliplus.dev，可与官方版共存）"
                required: false
                default: false
                type: boolean
            tag:
                description: "tag"
                required: false
                default: ""
                type: string

jobs:
    android:
        name: Build Android APK
        runs-on: ubuntu-latest
        permissions: write-all

        steps:
            - name: 代码迁出
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: 构建Java环境
              uses: actions/setup-java@v5
              with:
                  distribution: "zulu"
                  java-version: "17"
                  cache: "gradle"
                  cache-dependency-path: |
                      android/*.gradle*
                      android/**/gradle-wrapper.properties

            - name: 安装Flutter
              uses: subosito/flutter-action@v2
              id: flutter-action
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: Apply Patch
              shell: pwsh
              run: lib/scripts/patch.ps1 android

            - name: Set and Extract version
              shell: pwsh
              run: lib/scripts/build.ps1 android

            - name: Flutter Build Release Apk (dev 共存版)
              if: ${{ github.event.inputs.dev_suffix == 'true' }}
              run: flutter build apk --release --split-per-abi --dart-define-from-file=pili_release.json --no-pub --android-project-arg dev=1

            - name: Flutter Build Release Apk
              if: ${{ github.event.inputs.dev_suffix != 'true' }}
              run: flutter build apk --release --split-per-abi --dart-define-from-file=pili_release.json --no-pub

            - name: Rename
              shell: bash
              run: |
                  for file in build/app/outputs/flutter-apk/app-*-release.apk; do
                    abi=$(echo "$file" | sed -E 's|.*app-(.*)-release\.apk|\1|')
                    mv "$file" "PiliPlus_android_${{ env.version }}_${abi}.apk"
                  done

            - name: 上传 arm64
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: Android_arm64-v8a
                  path: PiliPlus_android_*_arm64-v8a.apk

            - name: 上传 v7a
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: Android_armeabi-v7a
                  path: PiliPlus_android_*_armeabi-v7a.apk
